<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Elskolen</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0d6b63">
<link rel="icon" href="ikoner/ikon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="ikoner/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Elskolen">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<link rel="stylesheet" href="css/app.css?v=0.4.2">
<link rel="stylesheet" href="css/tailwind.css?v=0.4.2">
</head>
<body class="min-h-full">
<p id="fail" hidden style="margin:16px;padding:12px;border:1px solid var(--crit);color:var(--crit)">Appen kunne ikke starte, fordi et script ikke blev indlæst. Genindlæs siden.</p>

<div x-data="app()" x-cloak class="mx-auto max-w-5xl px-4 pb-16 pt-4 flex flex-col gap-4" @keydown.window="key($event)">

  <!-- ===== HOVED ===== -->
  <header class="flex flex-wrap items-end justify-between gap-3">
    <div class="min-w-0">
      <h1 class="hd text-3xl font-bold leading-none">Elskolen</h1>
      <p class="text-xs text-muted mt-1" x-text="(storageOk ? 'Gemmes i browseren' : 'Browseren tillader ikke lokal lagring. Intet gemmes!') + ' · ' + synkTxt() + ' · version ' + appVersion"></p>
    </div>
    <div class="flex flex-wrap gap-2">
      <button class="btn" x-show="installPrompt && !installeret" @click="installer()">Installér app</button>
      <select class="inp !w-auto text-sm" aria-label="Tema" :value="tema" @change="saetTema($event.target.value)">
        <option value="auto">Tema: automatisk</option><option value="light">Tema: lyst</option><option value="dark">Tema: mørkt</option>
      </select>
    </div>
  </header>

  <nav class="faner flex overflow-x-auto border-b border-line" role="tablist">
    <template x-for="v in synligeViews()" :key="v.id">
      <button class="tab hd" role="tab" :aria-selected="view===v.id" :id="'tab-' + v.id" @click="gaaTil(v.id)"><span x-text="v.l"></span><kbd x-text="v.k"></kbd></button>
    </template>
  </nav>

  <p x-show="!klar" class="text-muted">Indlæser …</p>

  <!-- ===== ØV ===== -->
  <template x-if="klar && view==='oev'">
    <section class="flex flex-col gap-4" id="v-oev">
      <div class="grid grid-cols-2 sm:grid-cols-4 gap-2" x-data="{ get s() { return stat() } }">
        <div class="panel p-3"><div class="text-xs text-muted hd">I dag</div><div class="num text-2xl" id="s-idag" x-text="s.idag"></div></div>
        <div class="panel p-3"><div class="text-xs text-muted hd">Rigtige i dag</div><div class="num text-2xl" x-text="s.rigtige == null ? '–' : s.rigtige + ' %'"></div></div>
        <div class="panel p-3"><div class="text-xs text-muted hd">Stribe</div><div class="num text-2xl" id="s-stribe" x-text="s.stribe + (s.stribe === 1 ? ' dag' : ' dage')"></div></div>
        <div class="panel p-3"><div class="text-xs text-muted hd">Kort i alt</div><div class="num text-2xl" x-text="s.i_alt"></div><div class="text-xs text-muted" x-text="s.nye + ' nye'"></div></div>
      </div>

      <div class="flex flex-wrap items-center gap-2">
        <label class="text-sm text-muted" for="oev-emne">Emne</label>
        <select id="oev-emne" class="inp !w-auto" :value="oevEmne" @change="oevSkiftEmne($event.target.value)">
          <option value="">Alle emner (blandet)</option>
          <template x-for="e in emner" :key="e.id"><option :value="e.id" x-text="e.navn"></option></template>
        </select>
        <span class="text-sm text-muted ml-auto num" x-show="oevId" x-text="oevRest() + ' tilbage i økten'"></span>
      </div>

      <!-- Kortet -->
      <template x-if="oevId && oevKortet()">
        <div class="flex flex-col gap-3" x-data="{ get k() { return oevKortet() || normKort({ id:'-' }) } }">
          <article class="kortflade p-5 flex flex-col gap-4" id="oev-kort">
            <div class="flex flex-wrap items-center gap-2 text-xs text-muted">
              <span class="tag" x-text="emneKort(k.emne)"></span><span class="tag" x-text="korttyper[k.type]"></span>
              <span class="st" :class="kortStatus(k)" x-text="statusNavn[kortStatus(k)]"></span>
              <button class="btn btn-ghost ml-auto" @click="redigerKort(k)">Ret kort</button>
            </div>
            <div class="kt-tekst" id="oev-front" x-html="vis(k.front)"></div>
            <template x-if="oevVist">
              <div class="flex flex-col gap-3 border-t border-line pt-4">
                <div class="kt-tekst" id="oev-bag" x-html="vis(k.bag)"></div>
                <p class="text-xs text-muted" x-show="kildeTxt(k)">Kilde: <span x-text="kildeTxt(k)"></span><span x-show="k.kilde.gyldigFra" x-text="' · gyldig fra ' + k.kilde.gyldigFra"></span></p>
              </div>
            </template>
          </article>
          <div x-show="!oevVist"><button id="oev-vis" class="btn btn-primary w-full !py-3 text-base kb" @click="oevVis()">Vis svar <kbd>Mellemrum</kbd></button></div>
          <div x-show="oevVist" class="grid grid-cols-4 gap-2" x-data="{ get iv() { return oevVist ? oevIntervaller() : {} } }">
            <template x-for="r in karakterer" :key="r.r">
              <button class="btn rate kb" :class="'r' + r.r" :id="'oev-r' + r.r" @click="oevKarakter(r.r)">
                <span class="font-semibold" x-text="r.l"></span><small x-text="iv[r.r]"></small><kbd x-text="r.k"></kbd>
              </button>
            </template>
          </div>
          <div class="flex justify-between text-xs text-muted">
            <span class="kb" x-show="oevFortrydListe.length"><button class="btn btn-ghost" @click="oevFortryd()">Fortryd sidste</button> <kbd>Z</kbd></span>
            <span></span>
          </div>
        </div>
      </template>

      <!-- Færdig eller tomt -->
      <template x-if="!oevId">
        <div class="panel p-6 flex flex-col gap-3 items-start" id="oev-faerdig">
          <template x-if="aktiveKort().length">
            <div class="flex flex-col gap-3 items-start">
              <h2 class="hd text-xl" x-text="oevSet ? 'Færdig for i dag' : 'Intet at øve lige nu'"></h2>
              <p class="text-sm text-muted" x-text="'Du har svaret på ' + stat().idag + ' kort i dag. ' + stat().imorgen + ' kort forfalder senest i morgen.'"></p>
              <div class="flex flex-wrap gap-2">
                <button class="btn" @click="oevFlereNye(5)" :disabled="!aktiveKort().some(k => !tilst[k.id])">5 nye kort mere</button>
                <button class="btn" @click="oevStart()">Tjek igen</button>
              </div>
            </div>
          </template>
          <template x-if="!aktiveKort().length">
            <div class="flex flex-col gap-3 items-start">
              <h2 class="hd text-xl">Ingen kort endnu</h2>
              <p class="text-sm text-muted">Opret dine egne kort, importér fra Anki, eller start med en pakke startkort.</p>
              <div class="flex flex-wrap gap-2">
                <button class="btn btn-primary" @click="gaaTil('kort'); nytKortForm()">Opret kort</button>
                <template x-for="p in startpakker" :key="p.fil"><button class="btn" @click="indlaesStartpakke(p)" x-text="'Hent ' + p.navn"></button></template>
              </div>
            </div>
          </template>
        </div>
      </template>

      <!-- ===== OPGAVER: DAGENS REGNEOPGAVER (js/opgaver.js) ===== -->
      <template x-if="typeof opgStart === 'function'">
        <div class="panel p-4 flex flex-wrap items-center gap-3" id="oev-opgaver">
          <div class="min-w-0 flex-1">
            <h2 class="hd text-lg" id="oev-opg-titel" x-text="'Dagens regneopgaver (' + opgDagAntal() + ')'"></h2>
            <p class="text-xs text-muted" x-text="opgDagAntal() ? 'Nye tal hver gang. Svagt område kommer oftere.' : 'Dagens mål er nået. Du kan altid tage flere.'"></p>
          </div>
          <button class="btn btn-primary" id="oev-opg-start" @click="opgGaaTilDag()">Regn opgaver</button>
        </div>
      </template>

      <!-- Beherskelse pr. emne -->
      <div class="panel p-4 flex flex-col gap-2" x-show="emneStat().length">
        <h2 class="hd text-lg">Beherskelse pr. emne</h2>
        <p class="text-xs text-muted">Andel af emnets kort, du husker sikkert i mindst 21 dage.</p>
        <template x-for="e in emneStat()" :key="e.id">
          <div class="grid grid-cols-[minmax(0,1fr)_auto] gap-x-3 items-center text-sm">
            <span x-text="e.navn"></span><span class="num text-muted" x-text="e.modne + '/' + e.antal"></span>
            <div class="meter col-span-2"><i :style="'width:' + e.pct + '%'"></i></div>
          </div>
        </template>
      </div>
    </section>
  </template>

  <!-- ===== OPGAVER (fase 2, js/opgaver.js) ===== -->
  <template x-if="klar && view==='opgaver'">
    <section class="flex flex-col gap-4" id="v-opgaver" x-init="opgAkt || opgStart()">
      <div class="flex flex-wrap items-center gap-2">
        <label class="text-sm text-muted" for="opg-valg">Opgaver</label>
        <select id="opg-valg" class="inp !w-auto" :value="opgValg" @change="opgSkift($event.target.value)">
          <option value="blandet">Blandet efter svagheder</option>
          <optgroup label="Emne"><template x-for="e in emner.filter(x => opgGeneratorer.some(g => g.emne === x.id))" :key="e.id"><option :value="'emne:' + e.id" x-text="e.navn"></option></template></optgroup>
          <optgroup label="Generator"><template x-for="g in opgGeneratorer" :key="g.id"><option :value="'gen:' + g.id" x-text="g.navn"></option></template></optgroup>
        </select>
        <button class="btn btn-ghost ml-auto" id="opg-info" @click="modal='opgInfo'">Forudsætninger</button>
      </div>

      <template x-if="opgAkt && opgGen()">
        <article class="kortflade p-5 flex flex-col gap-4" id="opg-kort">
          <div class="flex flex-wrap items-center gap-2 text-xs text-muted">
            <span class="tag" x-text="opgGen().navn"></span><span class="tag" x-text="emneKort(opgGen().emne)"></span><span class="tag" x-text="'Niveau ' + opgGen().niveau"></span>
            <span class="ml-auto num" x-text="'Seed ' + opgAkt.seed"></span>
          </div>
          <div class="kt-tekst" id="opg-tekst" x-html="vis(opgAkt.opg.tekst)"></div>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <template x-for="s in opgAkt.opg.svar" :key="s.id">
              <label class="f">
                <span x-html="vis(s.navn)"></span>
                <span class="flex items-center gap-2">
                  <input class="inp num flex-1 min-w-0" inputmode="decimal" autocomplete="off" data-opg-svar :id="'opg-svar-' + s.id" :disabled="!!opgRes"
                    x-model="opgInd[s.id]" @keydown="opgTast($event)" placeholder="fx 4,7">
                  <span class="text-sm text-muted" x-text="s.enhed"></span>
                </span>
                <template x-if="opgDel(s.id)">
                  <span class="text-xs" :id="'opg-ok-' + s.id" :style="'color:var(' + (opgOk(s.id) ? '--ok' : '--crit') + ')'"
                    x-text="opgOk(s.id) ? 'Rigtigt' : 'Rigtigt svar: ' + opgFmt(s.vaerdi) + ' ' + s.enhed"></span>
                </template>
              </label>
            </template>
          </div>

          <div class="flex flex-wrap gap-2">
            <button class="btn btn-primary" id="opg-tjek" x-show="!opgRes" @click="opgTjek()">Tjek svar <kbd>Enter</kbd></button>
            <button class="btn btn-primary" id="opg-naeste" x-show="opgRes" @click="opgStart()">Næste opgave <kbd>Enter</kbd></button>
            <button class="btn" id="opg-spring" x-show="!opgRes" @click="opgStart()">Spring over</button>
          </div>

          <template x-if="opgRes">
            <div class="flex flex-col gap-3 border-t border-line pt-4" id="opg-feedback">
              <p class="font-semibold" id="opg-resultat" :style="'color:var(' + (opgRes.korrekt ? '--ok' : '--crit') + ')'"
                x-text="opgRes.korrekt ? 'Rigtigt!' : (opgRes.score > 0 ? 'Delvist rigtigt' : 'Ikke rigtigt')"></p>
              <template x-if="opgRes.fejltype">
                <div class="panel p-3 text-sm" id="opg-fejl">
                  <p class="font-semibold" x-text="'Typisk fejl: ' + opgFejlNavn(opgRes.fejltype)"></p>
                  <p class="kt-tekst !text-base" x-html="vis(opgRes.forklaring)"></p>
                </div>
              </template>
              <div id="opg-trin" class="flex flex-col gap-2" x-show="!opgRes.korrekt">
                <p class="text-xs font-semibold text-muted uppercase tracking-wide">Trinvis løsning</p>
                <ol class="list-decimal pl-5 flex flex-col gap-2">
                  <template x-for="(t, i) in opgAkt.opg.trin" :key="i"><li class="kt-tekst !text-base" x-html="vis(t)"></li></template>
                </ol>
              </div>
            </div>
          </template>
        </article>
      </template>

      <!-- Træfsikkerhed pr. generator -->
      <div class="panel p-4 flex flex-col gap-2" id="opg-stat">
        <h2 class="hd text-lg">Træfsikkerhed pr. opgavetype</h2>
        <p class="text-xs text-muted" x-text="'I dag: ' + opgIDag() + ' opgaver. Dagsmål: ' + opgDagsmaal + '.'"></p>
        <template x-for="s in opgStat()" :key="s.id">
          <div class="grid grid-cols-[minmax(0,1fr)_auto] gap-x-3 items-center text-sm">
            <button class="text-left hover:underline" @click="opgSkift('gen:' + s.id)" x-text="s.navn"></button>
            <span class="num text-muted" x-text="s.forsoeg ? s.rigtige + '/' + s.forsoeg + ' (' + s.pct + ' %)' : 'ikke prøvet'"></span>
            <div class="meter col-span-2"><i :style="'width:' + (s.pct || 0) + '%'"></i></div>
            <p class="col-span-2 text-xs text-muted" x-show="s.topFejl" x-text="'Hyppigste fejl: ' + s.topFejl"></p>
          </div>
        </template>
      </div>
    </section>
  </template>

  <!-- ===== CASES (fase 4, js/cases.js) ===== -->
  <template x-if="klar && view==='cases'">
    <section class="flex flex-col gap-4" id="v-cases" x-init="caseStart()">
      <div class="flex flex-wrap gap-2 items-center">
        <button id="case-vis-liste" class="btn" :class="caseVis==='liste' && 'sel'" @click="caseVis='liste'">Cases</button>
        <button id="case-vis-regler" class="btn" :class="caseVis==='regler' && 'sel'" @click="caseVis='regler'">Regelbibliotek</button>
        <span class="text-xs text-muted sm:ml-auto">Vejledende indhold. Reglerne er ikke kontrolleret mod kilden.</span>
      </div>
      <p class="warn text-sm" x-show="caseFejl" x-text="caseFejl"></p>
      <p class="text-muted" x-show="caseHenter">Henter cases …</p>

      <!-- Liste over cases med fremskridt -->
      <template x-if="caseVis==='liste' && !caseAktiv">
        <div class="grid sm:grid-cols-2 gap-3" id="case-liste">
          <template x-for="c in caseListe" :key="c.id">
            <div class="panel p-4 flex flex-col gap-2">
              <div class="flex flex-wrap gap-2 items-center text-xs text-muted">
                <span class="tag" x-text="emneKort(c.emne)"></span>
                <span class="num ml-auto" x-text="caseForsoeg(c.id).length + ' forsøg · bedste ' + casePct(caseBedste(c.id))"></span>
              </div>
              <h2 class="hd text-lg" x-text="c.titel"></h2>
              <p class="text-sm text-muted klip" x-text="c.intro"></p>
              <div class="meter"><i :style="'width:' + Math.round((caseBedste(c.id) || 0) * 100) + '%'"></i></div>
              <button class="btn btn-primary self-start" :id="'case-start-' + c.id" @click="caseBegynd(c)" x-text="caseForsoeg(c.id).length ? 'Prøv igen' : 'Start'"></button>
            </div>
          </template>
        </div>
      </template>

      <!-- En case i gang -->
      <template x-if="caseVis==='liste' && caseAktiv">
        <div class="flex flex-col gap-3" id="case-aktiv" x-data="{ get a() { return caseAktiv || CASE_TOM }, get t() { return caseTrin() || CASE_TOM.c.trin.slut } }">
          <div class="flex flex-wrap items-center gap-2">
            <h2 class="hd text-xl" x-text="a.c.titel"></h2>
            <button class="btn btn-ghost ml-auto" id="case-luk" @click="a.slut ? caseLuk() : spoerg('Afbryd casen? Forsøget gemmes ikke.', () => caseLuk(), 'Afbryd')" x-text="a.slut ? 'Tilbage til listen' : 'Afbryd'"></button>
          </div>
          <details class="panel p-3 text-sm" :open="!a.vej.length">
            <summary class="cursor-pointer text-muted">Situationen</summary>
            <div class="mt-2" x-html="vis(a.c.intro)"></div>
          </details>

          <template x-if="!a.slut">
            <article class="kortflade p-5 flex flex-col gap-4" id="case-trin">
              <div class="flex flex-wrap items-center gap-2 text-xs text-muted">
                <span class="num" x-text="'Trin ' + (a.vej.length + 1)"></span>
                <template x-for="rid in (t.regler || [])" :key="rid">
                  <button class="tag cursor-pointer" @click="caseVisRegel(rid)" x-text="caseRegel(rid) ? caseRegel(rid).titel : rid"></button>
                </template>
              </div>
              <div class="kt-tekst" id="case-tekst" x-html="vis(t.tekst)"></div>

              <template x-if="t.type==='valg'">
                <div class="flex flex-col gap-2">
                  <template x-for="(s, i) in t.svar" :key="i">
                    <button class="btn !justify-start !whitespace-normal text-left !py-2 !text-sm" :id="'case-svar-' + i" :disabled="!!a.svar && a.svar.v !== i"
                      :class="a.svar && a.svar.v === i && 'sel'" @click="caseSvarValg(i)"><span x-html="vis(s.tekst)"></span></button>
                  </template>
                </div>
              </template>

              <template x-if="t.type==='tal'">
                <div class="flex flex-wrap items-end gap-2">
                  <label class="f">Dit svar<input id="case-tal" class="inp num !w-40" inputmode="decimal" autocomplete="off" x-model="a.tal" :disabled="!!a.svar" @keydown.enter.prevent="caseSvarTal()"></label>
                  <span class="pb-2" x-text="t.enhed"></span>
                  <button id="case-tjek" class="btn btn-primary" x-show="!a.svar" @click="caseSvarTal()">Tjek</button>
                </div>
              </template>

              <template x-if="t.type==='flere'">
                <div class="flex flex-col gap-2">
                  <template x-for="(m, i) in t.muligheder" :key="i">
                    <label class="panel p-2 flex gap-2 items-start text-sm cursor-pointer" :style="a.svar ? 'border-color:' + (m.rigtig ? 'var(--ok)' : (a.flere[i] ? 'var(--crit)' : 'var(--line)')) : ''">
                      <input type="checkbox" class="mt-1" :id="'case-flere-' + i" x-model="a.flere[i]" :disabled="!!a.svar">
                      <span class="flex flex-col gap-1"><span x-html="vis(m.tekst)"></span>
                        <span class="text-xs text-muted" x-show="a.svar" x-html="(m.rigtig ? 'Rigtig: ' : 'Forkert: ') + vis(m.feedback)"></span></span>
                    </label>
                  </template>
                  <button id="case-tjek" class="btn btn-primary self-start" x-show="!a.svar" @click="caseSvarFlere()">Tjek</button>
                </div>
              </template>

              <template x-if="a.svar">
                <div class="panel p-3 flex flex-col gap-2 text-sm" id="case-feedback" x-data="{ get sv() { return a.svar || { p:0, m:0, feedback:'' } } }" :style="'border-left:4px solid ' + caseFarve(sv)">
                  <p class="font-semibold" x-text="sv.m === 0 ? 'Konsekvens' : sv.p >= sv.m ? 'Rigtigt' : sv.p > 0 ? 'Delvis rigtigt' : 'Ikke rigtigt'"></p>
                  <div x-show="sv.feedback" x-html="vis(sv.feedback)"></div>
                  <div x-show="t.type==='tal' && t.loesning" class="kt-tekst !text-base" x-html="vis(t.loesning || '')"></div>
                  <button id="case-videre" class="btn btn-primary self-start" @click="caseVidere()">Fortsæt</button>
                </div>
              </template>
            </article>
          </template>

          <!-- Gennemgang efter casen -->
          <template x-if="a.slut">
            <div class="flex flex-col gap-3" id="case-slut">
              <div class="panel p-4 flex flex-col gap-2">
                <div class="flex flex-wrap items-baseline gap-3"><span class="num text-3xl" id="case-score" x-text="casePct(a.score)"></span>
                  <span class="text-sm" x-text="a.score >= 0.8 ? 'Godt klaret.' : 'Gennemgå forklaringerne og prøv igen.'"></span></div>
                <p class="text-sm" x-html="vis(t.tekst)"></p>
              </div>
              <template x-for="(g, i) in caseGennemgang()" :key="i">
                <div class="panel p-3 flex flex-col gap-2 text-sm case-gennemgang" :style="'border-left:4px solid ' + caseFarve(g.v)">
                  <div class="flex gap-2 items-baseline"><span class="num text-xs text-muted" x-text="(i + 1) + '.'"></span><div x-html="vis(g.t.tekst)"></div>
                    <span class="num text-xs text-muted ml-auto whitespace-nowrap" x-show="g.v.m" x-text="g.v.p + '/' + g.v.m"></span></div>
                  <p><span class="text-muted">Dit valg: </span><span x-html="vis(g.valg)"></span></p>
                  <div class="text-muted" x-html="vis(g.fb)"></div>
                  <div class="flex flex-wrap gap-1" x-show="(g.t.regler || []).length">
                    <template x-for="rid in (g.t.regler || [])" :key="rid"><button class="tag cursor-pointer" @click="caseVisRegel(rid)" x-text="caseRegel(rid) ? caseRegel(rid).titel : rid"></button></template>
                  </div>
                </div>
              </template>
              <div class="flex flex-wrap gap-2">
                <button class="btn btn-primary" @click="caseBegynd(a.c)">Prøv igen</button>
                <button class="btn" @click="caseLuk()">Tilbage til listen</button>
              </div>
            </div>
          </template>
        </div>
      </template>

      <!-- Regelbibliotek -->
      <template x-if="caseVis==='regler'">
        <div class="flex flex-col gap-3" id="case-regler">
          <label class="f">Søg i reglerne<input id="case-regel-soeg" class="inp" type="search" x-model="caseRegelQ" placeholder="Titel, tekst, tag, dokument eller afsnit"></label>
          <p class="text-xs text-muted">Resuméerne er skrevet med egne ord. En regel er ikke kontrolleret mod kilden, før der står "Kontrolleret". Slå altid op i den gældende udgave.</p>
          <p class="text-sm text-muted num" x-text="caseReglerListe().length + ' regler'"></p>
          <template x-for="r in caseReglerListe()" :key="r.id">
            <div class="panel p-3 flex flex-col gap-2 case-regel">
              <div class="flex flex-wrap items-center gap-2">
                <h3 class="font-semibold" x-text="r.titel"></h3>
                <span class="st" :style="'color:' + (r.verificeret ? 'var(--ok)' : 'var(--crit)')" x-text="r.verificeret ? 'Kontrolleret' : 'Ikke kontrolleret mod kilden'"></span>
              </div>
              <p class="text-xs text-muted" x-text="caseKildeTxt(r)"></p>
              <div class="text-sm" x-html="vis(r.resume)"></div>
              <div class="flex flex-wrap items-center gap-1">
                <span class="tag" x-text="emneKort(r.emne)"></span>
                <template x-for="tg in (r.tags || [])" :key="tg"><span class="tag" x-text="tg"></span></template>
                <a class="text-xs underline ml-2" x-show="r.url" :href="r.url" target="_blank" rel="noopener">Kilde</a>
                <button class="btn ml-auto case-lav-kort" :disabled="caseHarKort(r)" @click="caseLavKort(r)" x-text="caseHarKort(r) ? 'Kort findes' : 'Lav kort'"></button>
              </div>
            </div>
          </template>
        </div>
      </template>
    </section>
  </template>

  <!-- ===== FEJLFINDING (fase 5, js/fejlfinding.js) ===== -->
  <template x-if="klar && view==='fejlfinding'">
    <section class="flex flex-col gap-4" id="v-fejlfinding" x-init="ffStart()">
      <template x-if="ffScen">
        <div class="flex flex-col gap-4">
          <div class="panel p-4 flex flex-col gap-2">
            <div class="flex flex-wrap items-center gap-2">
              <h2 class="hd text-xl" x-text="ffScen.navn"></h2><span class="tag num" x-text="'Scenarie ' + ffScen.seed"></span>
              <button id="ff-nyt" class="btn ml-auto" @click="ffNyt()">Nyt scenarie</button>
            </div>
            <p class="text-sm"><strong>Henvendelse:</strong> <span id="ff-symptom" x-text="ffScen.symptom"></span></p>
            <p class="text-sm text-muted" x-text="ffInfoTxt()"></p>
            <p class="text-sm">Find fejlen med så få målinger som muligt, og overhold sikkerhedsreglerne.</p>
          </div>

          <div class="panel p-3 flex flex-wrap items-center gap-2" id="ff-tilstand">
            <span class="st" :class="ffLevende ? 'forfalden' : 'gentages'" x-text="ffLevende ? 'Spændingsførende' : 'Spændingsløs og sikret'"></span>
            <button id="ff-frakobl" class="btn" x-show="ffLevende" :disabled="!!ffSvar" @click="ffAabnSikkerhed()">Gør spændingsløs</button>
            <button id="ff-tilkobl" class="btn" x-show="!ffLevende" :disabled="!!ffSvar" @click="ffTilkobl()">Sæt spænding på</button>
            <span class="text-xs text-muted ml-auto num" x-text="ffMaalinger.length + ' målinger' + (ffSikFejl ? ' · ' + ffSikFejl + ' sikkerhedsfejl' : '')"></span>
          </div>

          <div class="panel p-2 overflow-x-auto" id="ff-diagram" @click="ffKlikSvg($event)" x-html="ffSvg()"></div>
          <ul class="text-xs text-muted grid grid-cols-1 sm:grid-cols-2 gap-1 -mt-2 px-1">
            <template x-for="n in ffScen.noder.filter(n => n.art !== 'tavle' && n.art !== 'daase')" :key="n.id">
              <li><strong class="text-ink" x-text="n.kode"></strong> <span x-text="n.navn + ' (' + FF_ART[n.art].toLowerCase() + ', via ' + n.op + ')'"></span></li>
            </template>
          </ul>

          <div class="panel p-4 flex flex-col gap-3">
            <label class="f">Målepunkt (eller klik i diagrammet)
              <select id="ff-punkt" class="inp" x-model="ffPunkt">
                <template x-for="n in ffScen.noder" :key="n.id"><option :value="n.id" :selected="n.id===ffPunkt" x-text="ffPunktNavn(n.id)"></option></template>
              </select>
            </label>
            <div class="grid grid-cols-2 sm:grid-cols-4 gap-2">
              <template x-for="m in ffMaaleTyper" :key="m.id">
                <button class="btn !whitespace-normal" :id="'ff-m-' + m.id" :disabled="!!ffSvar" @click="ffMaal(m.id)" x-text="m.l"></button>
              </template>
            </div>
            <template x-if="ffSidste()">
              <p id="ff-sidste" class="text-sm" :class="ffSidste().fare && 'warn'">
                <span class="text-muted" x-text="ffMaalNavn(ffSidste().m) + ' ved ' + ffPunktNavn(ffSidste().p) + ': '"></span><strong class="num" x-text="ffSidste().tekst"></strong>
              </p>
            </template>
            <div class="overflow-x-auto" x-show="ffMaalinger.length">
              <table class="kt" id="ff-tabel">
                <thead><tr><th>Nr.</th><th>Punkt</th><th>Måling</th><th>Resultat</th></tr></thead>
                <tbody>
                  <template x-for="x in [...ffMaalinger].reverse()" :key="x.nr">
                    <tr :class="x.fare && 'warn'"><td class="num" x-text="x.nr"></td><td x-text="ffScen.noder.find(n => n.id === x.p).kode"></td><td x-text="ffMaalNavn(x.m)"></td>
                      <td class="num" x-text="x.tekst"></td></tr>
                  </template>
                </tbody>
              </table>
            </div>
            <details class="text-xs text-muted">
              <summary class="cursor-pointer">Grænseværdier</summary>
              <ul class="mt-1 flex flex-col gap-1">
                <li>Isolationsmodstand ved 500 V DC: mindst 1 MΩ (DS/HD 60364-6). Fejlfri installation måler typisk over 999 MΩ.</li>
                <li>Kontinuitet i PE: svarer til ρ · l / A for vejen fra tavlen.</li>
                <li x-text="ffGraenseTekst() + ' Faktoren 2/3 er en tommelfingerregel for, at lederne er varmere under en fejl end ved målingen.'"></li>
                <li>RCD: udløsning inden for 300 ms ved 1 × IΔn.</li>
              </ul>
            </details>
          </div>

          <template x-if="!ffSvar">
            <div class="panel p-4 flex flex-col gap-3" id="ff-diag">
              <h2 class="hd text-lg">Diagnose</h2>
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <label class="f">Fejltype<select id="ff-type" class="inp" x-model="ffDiag.type"><option value="">Vælg …</option>
                  <template x-for="f in ffFejltyper" :key="f.id"><option :value="f.id" x-text="f.navn"></option></template></select></label>
                <label class="f">Placering<select id="ff-sted" class="inp" x-model="ffDiag.sted"><option value="">Vælg …</option>
                  <template x-for="x in ffStedListe(ffScen)" :key="x.id"><option :value="x.id" x-text="x.navn"></option></template></select></label>
              </div>
              <button id="ff-diagnose" class="btn btn-primary self-start" :disabled="!ffDiag.type || !ffDiag.sted" @click="ffDiagnose()">Afgiv diagnose</button>
            </div>
          </template>

          <template x-if="ffSvar">
            <div class="panel p-4 flex flex-col gap-3" id="ff-svar">
              <h2 class="hd text-xl" :class="ffSvar.korrekt ? 'text-accent' : 'text-crit'" x-text="ffSvar.korrekt ? 'Rigtigt fundet' : (ffSvar.typeOk ? 'Rigtig fejltype, forkert placering' : 'Forkert fejltype')"></h2>
              <p class="text-sm"><span x-text="'Fejlen var: ' + ffFejlTekst()"></span> <span class="num" x-text="'Score ' + Math.round(ffSvar.score * 100) + ' %'"></span></p>
              <p class="text-sm warn" x-show="ffSikFejl" x-text="ffSikFejl + ' måling(er) på spændingsførende anlæg, hvor det ikke må ske: −' + (ffSikFejl * 25) + ' point.'"></p>
              <p class="text-sm" x-text="ffFejltyper.find(f => f.id === ffScen.fejl.type).forklaring"></p>
              <div class="flex flex-col gap-1" x-show="ffSvar.afvigende.length">
                <h3 class="hd text-base">Dine målinger, der afveg fra et fejlfrit anlæg</h3>
                <ul class="text-sm flex flex-col gap-1">
                  <template x-for="x in ffSvar.afvigende" :key="x.nr"><li><span x-text="'Nr. ' + x.nr + ': ' + ffMaalNavn(x.m) + ' ved ' + ffPunktNavn(x.p) + ' gav '"></span><strong class="num" x-text="x.tekst"></strong></li></template>
                </ul>
              </div>
              <div class="flex flex-col gap-1">
                <h3 class="hd text-base">Målinger, der afslører fejlen (uden fejl → med fejl)</h3>
                <ul class="text-sm flex flex-col gap-1">
                  <template x-for="(x, i) in ffSvar.afg.slice(0, 8)" :key="i"><li><span x-text="ffMaalNavn(x.m) + ' ved ' + ffPunktNavn(x.p) + ': '"></span><span class="num" x-text="x.uden + ' → ' + x.med"></span></li></template>
                </ul>
                <p class="text-xs text-muted" x-show="ffSvar.afg.length > 8" x-text="'… og ' + (ffSvar.afg.length - 8) + ' til.'"></p>
              </div>
              <p class="text-xs text-muted">Modellen er forenklet og vejledende. Følg altid gældende regler og din virksomheds instruktioner.</p>
              <button id="ff-igen" class="btn btn-primary self-start" @click="ffNyt()">Nyt scenarie</button>
            </div>
          </template>
        </div>
      </template>
    </section>
  </template>

  <!-- ===== KOMPETENCE (fase 3, js/kompetence.js) ===== -->
  <template x-if="klar && view==='kompetence'">
    <section class="flex flex-col gap-4" id="v-kompetence" x-init="kompStart()">
      <p class="text-xs text-muted">Beherskelse samles af kortenes hukommelse (FSRS), opgaver, cases og fejlfinding. Tallene er en vejledende rettesnor, ikke en prøve. Områder uden data vises som «Ingen data».</p>

      <template x-if="kompSvageste().length">
        <div class="panel p-3 flex flex-col gap-2" id="komp-svageste">
          <h2 class="hd text-lg">Svageste områder lige nu</h2>
          <template x-for="x in kompSvageste()" :key="x.emne + x.d.id">
            <div class="flex flex-wrap items-center gap-2 text-sm">
              <span class="tag" x-text="x.emneNavn"></span><span x-text="x.d.navn"></span><span class="num text-muted" x-text="kompPct(x.d.beh)"></span>
              <button class="btn ml-auto" @click="kompOev(x.emne, x.d)">Øv her</button>
            </div>
          </template>
        </div>
      </template>

      <div class="flex flex-col gap-2" id="komp-trae" x-data="{ get t() { return kompTrae() } }">
        <template x-for="e in t" :key="e.id">
          <div class="panel" :id="'komp-emne-' + e.id">
            <div class="p-3 flex flex-wrap items-center gap-3">
              <button class="btn btn-ghost" :id="'komp-vis-' + e.id" :aria-expanded="!!kompAaben[e.id]" @click="kompToggle(e.id)" x-text="kompAaben[e.id] ? '▾' : '▸'"></button>
              <div class="min-w-0 grow">
                <div class="flex flex-wrap items-center gap-2"><span class="hd text-lg" x-text="e.navn"></span><span class="tag" x-show="e.niveau" x-text="e.niveau && e.niveau.navn"></span></div>
                <div class="h-2 rounded-sm mt-1" style="background:var(--line)"><div class="h-2 rounded-sm" :style="'width:' + Math.round((e.beh || 0) * 100) + '%;background:' + kompFarve(e.beh)"></div></div>
                <div class="text-xs text-muted mt-1" x-text="e.beh == null ? 'Ingen data' : ['kort', 'opgave', 'case', 'fejlfinding'].filter(a => e.kilder[a]).map(a => kompKildeTxt(a, e.kilder[a])).join(' · ')"></div>
              </div>
              <span class="num text-xl komp-pct" x-text="kompPct(e.beh)"></span>
              <button class="btn" @click="kompOev(e.id, null)">Øv emnet</button>
            </div>
            <div class="border-t border-line p-3 flex flex-col gap-2" x-show="kompAaben[e.id]" x-cloak>
              <p class="text-sm text-muted" x-show="!e.delemner.length">Ingen delemner endnu.</p>
              <template x-for="d in e.delemner" :key="d.id">
                <div class="flex flex-wrap items-center gap-3 text-sm" :id="'komp-del-' + e.id + '-' + d.id">
                  <div class="min-w-0 grow">
                    <div class="flex flex-wrap items-center gap-2"><span x-text="d.navn"></span><span class="tag" x-show="d.niveau" x-text="d.niveau && d.niveau.navn"></span></div>
                    <div class="h-1.5 rounded-sm mt-1" style="background:var(--line)"><div class="h-1.5 rounded-sm" :style="'width:' + Math.round((d.beh || 0) * 100) + '%;background:' + kompFarve(d.beh)"></div></div>
                    <div class="text-xs text-muted mt-1" x-text="d.beh == null ? 'Ingen data' : ['kort', 'opgave', 'case', 'fejlfinding'].filter(a => d.kilder[a]).map(a => kompKildeTxt(a, d.kilder[a])).join(' · ')"></div>
                  </div>
                  <span class="num" x-text="kompPct(d.beh)"></span>
                  <button class="btn btn-ghost" x-show="kompHarOev(d)" @click="kompOev(e.id, d)">Øv</button>
                </div>
              </template>
            </div>
          </div>
        </template>
      </div>

      <div class="panel p-4 flex flex-col gap-3" id="komp-fejl">
        <div class="flex flex-wrap items-center gap-2">
          <h2 class="hd text-xl">Typiske fejl</h2>
          <select id="komp-periode" class="inp !w-auto ml-auto" aria-label="Periode" x-model="kompPeriode">
            <option value="30">Seneste 30 dage</option><option value="90">Seneste 90 dage</option><option value="alt">Alt</option>
          </select>
          <select id="komp-art" class="inp !w-auto" aria-label="Art" x-model="kompArtFilter">
            <option value="">Alle arter</option><option value="opgave">Opgaver</option><option value="case">Cases</option><option value="fejlfinding">Fejlfinding</option>
          </select>
        </div>
        <p class="text-sm text-muted" x-show="!kompFejlLog().length">Ingen registrerede fejl i perioden. Fejl dukker op her, når du laver opgaver, cases og fejlfinding.</p>
        <ul class="flex flex-col divide-y divide-line">
          <template x-for="x in kompFejlLog()" :key="x.art + x.kode">
            <li class="py-2 flex flex-wrap items-center gap-3 komp-fejl-raekke">
              <div class="min-w-0 grow">
                <div class="flex flex-wrap items-center gap-2"><span class="tag" x-text="kompArter[x.art]"></span><span class="text-sm" x-text="x.navn"></span></div>
                <div class="text-xs text-muted mt-1"><span class="num" x-text="x.antal + (x.antal === 1 ? ' gang' : ' gange') + ' · ' + Math.round(x.andel * 100) + ' %'"></span>
                  <span x-show="x.tendens" x-text="' · ' + kompTendensTxt(x)"></span><span x-text="' · sidst ' + datoTxt(x.sidst)"></span></div>
              </div>
              <div class="flex items-end gap-0.5 h-6" aria-hidden="true" title="Seneste 8 uger">
                <template x-for="(u, i) in x.uger" :key="i"><div class="w-1.5 rounded-sm" :style="'height:' + Math.max(8, Math.round(u * 100)) + '%;background:' + (u ? 'var(--ok)' : 'var(--line)')"></div></template>
              </div>
              <div class="flex flex-wrap gap-1">
                <template x-for="g in x.gens" :key="g"><button class="btn btn-ghost" @click="kompOevOpgave(g)" x-text="'Træn: ' + kompGenNavn(g)"></button></template>
                <button class="btn btn-ghost" x-show="x.caseId" @click="kompAabnCase(x.caseId)">Åbn casen</button>
                <button class="btn btn-ghost" x-show="x.art === 'fejlfinding'" @click="kompOevFejlfinding(x.kode)">Træn fejlfinding</button>
              </div>
            </li>
          </template>
        </ul>
      </div>
    </section>
  </template>

  <!-- ===== PRØVE (fase 6, js/proeve.js) ===== -->
  <template x-if="klar && view==='proeve'">
    <section class="flex flex-col gap-4" id="v-proeve" x-data="{ get p() { return proeveAkt || PROEVE_TOM } }" x-init="proeveStart()">
      <p class="text-xs text-muted">Prøvesimulering. Sammensætning og karakter er vejledende og er ikke den officielle prøveform. Regler, der ikke er kontrolleret mod kilden, er markeret.</p>

      <!-- Start -->
      <template x-if="!proeveAkt">
        <div class="flex flex-col gap-4" id="proeve-start">
          <div class="panel p-4 flex flex-col gap-3">
            <h2 class="hd text-lg">Ny prøve</h2>
            <label class="f">Niveau
              <select id="proeve-niveau" class="inp" :value="proeveNiv" @change="proeveVaelgNiveau($event.target.value)">
                <template x-for="n in proeveNiveauer" :key="n.id"><option :value="n.id" :selected="n.id===proeveNiv" x-text="n.navn"></option></template>
              </select>
            </label>
            <p class="text-xs text-muted">Standard er autoriseret elinstallatør. Ret selv tid og antal her.</p>
            <div class="grid grid-cols-2 sm:grid-cols-5 gap-3">
              <label class="f">Minutter (0 = uden tid)<input id="proeve-min" type="number" min="0" max="300" class="inp num" x-model.number="proeveInd.min" @change="proeveGem()"></label>
              <label class="f">Kort<input id="proeve-n-kort" type="number" min="0" max="50" class="inp num" x-model.number="proeveInd.kort" @change="proeveGem()"></label>
              <label class="f">Regler<input id="proeve-n-regler" type="number" min="0" max="50" class="inp num" x-model.number="proeveInd.regler" @change="proeveGem()"></label>
              <label class="f">Opgaver<input id="proeve-n-opg" type="number" min="0" max="30" class="inp num" x-model.number="proeveInd.opg" @change="proeveGem()"></label>
              <label class="f">Cases<input id="proeve-n-cases" type="number" min="0" max="10" class="inp num" x-model.number="proeveInd.cases" @change="proeveGem()"></label>
            </div>
            <p class="text-xs text-muted">Point: kort og regler 1, opgaver 2, cases 3. Kort og regler vurderer du selv, når du har set svaret.</p>
            <div class="panel p-3 flex flex-col gap-2 text-sm" id="proeve-el">
              <p id="proeve-el-info" x-text="proeveElTxt()"></p>
              <label class="flex items-center gap-2" x-show="proeveEl.fundet"><input id="proeve-brug-el" type="checkbox" x-model="proeveBrugEl"> Lav opgaver ud fra mine projekter</label>
              <a id="proeve-el-link" class="underline self-start" href="../" target="_blank" rel="noopener">Åbn El-oversigten</a>
            </div>
            <button id="proeve-begynd" class="btn btn-primary self-start" @click="proeveBegynd()">Start prøven</button>
          </div>

          <div class="panel p-4 flex flex-col gap-2" id="proeve-hist">
            <h2 class="hd text-lg">Tidligere prøver</h2>
            <p class="text-sm text-muted" x-show="!proeveHistorik().length">Ingen prøver endnu.</p>
            <template x-for="h in proeveHistorik()" :key="h.id">
              <p class="text-sm flex flex-wrap gap-x-3"><span class="num text-muted" x-text="datoTxt(h.tid)"></span><span x-text="h.navn"></span>
                <span class="num" x-text="'Karakter ' + h.karakter + ' (' + h.pct + ' %)'"></span><span class="text-muted" x-show="h.tidUd">Tiden løb ud</span></p>
            </template>
          </div>
        </div>
      </template>

      <!-- Under prøven -->
      <template x-if="proeveAkt && !p.faerdig">
        <div class="flex flex-col gap-3" id="proeve-koer">
          <div class="flex flex-wrap items-center gap-2">
            <h2 class="hd text-xl" x-text="p.navn"></h2>
            <span class="num text-lg" id="proeve-tid" x-show="p.slutTid" x-text="proeveTid()" :style="proeveRest < 300 && 'color:var(--crit)'"></span>
            <button class="btn btn-ghost ml-auto" id="proeve-afbryd" @click="proeveAfbryd()">Afbryd</button>
          </div>
          <div class="flex flex-wrap gap-1" id="proeve-nav">
            <template x-for="(it, i) in p.items" :key="i">
              <button class="btn !px-2 num" :id="'proeve-nr-' + i" :class="p.nu===i && 'sel'" :style="proeveSvaret(it) && p.nu!==i ? 'border-color:var(--ok)' : ''" @click="proeveGaa(i)" x-text="i + 1"></button>
            </template>
          </div>

          <template x-if="proeveCur()">
            <article class="kortflade p-5 flex flex-col gap-4" id="proeve-sp" x-data="{ get it() { return proeveCur() || PROEVE_TOM_SP } }">
              <div class="flex flex-wrap items-center gap-2 text-xs text-muted">
                <span class="tag" x-text="{ kort:'Kort', regel:'Regel', opgave:'Opgave', case:'Case' }[it.art]"></span><span class="tag" x-text="emneKort(it.emne)"></span>
                <span class="num ml-auto" x-text="(p.nu + 1) + ' af ' + p.items.length + ' · ' + proeveVaegt[it.art] + ' point'"></span>
              </div>

              <template x-if="it.art==='kort'">
                <div class="flex flex-col gap-3">
                  <div class="kt-tekst" id="proeve-front" x-html="vis(it.k.front)"></div>
                  <button class="btn self-start" id="proeve-vis" x-show="!it.vist" @click="it.vist=true">Vis svar</button>
                  <div class="flex flex-col gap-3 border-t border-line pt-3" x-show="it.vist"><div class="kt-tekst" id="proeve-bag" x-html="vis(it.k.bag)"></div></div>
                </div>
              </template>
              <template x-if="it.art==='regel'">
                <div class="flex flex-col gap-3">
                  <div class="kt-tekst" id="proeve-front" x-html="vis('Hvad er reglen om: **' + it.r.titel + '**?')"></div>
                  <p class="text-xs text-muted" x-text="it.r.kilde"></p>
                  <button class="btn self-start" id="proeve-vis" x-show="!it.vist" @click="it.vist=true">Vis svar</button>
                  <div class="flex flex-col gap-2 border-t border-line pt-3" x-show="it.vist">
                    <div class="kt-tekst" id="proeve-bag" x-html="vis(it.r.resume)"></div>
                    <p class="warn text-xs" x-show="!it.r.verificeret">Ikke kontrolleret mod kilden. Slå op i den gældende udgave.</p>
                  </div>
                </div>
              </template>
              <template x-if="(it.art==='kort' || it.art==='regel') && it.vist">
                <div class="flex flex-wrap items-center gap-2" id="proeve-vurder">
                  <span class="text-sm text-muted">Hvordan gik det?</span>
                  <button class="btn" id="proeve-v-1" :class="it.vurd===1 && 'sel'" @click="proeveVurder(it, 1)">Rigtigt</button>
                  <button class="btn" id="proeve-v-05" :class="it.vurd===0.5 && 'sel'" @click="proeveVurder(it, 0.5)">Delvist</button>
                  <button class="btn" id="proeve-v-0" :class="it.vurd===0 && 'sel'" @click="proeveVurder(it, 0)">Forkert</button>
                </div>
              </template>

              <template x-if="it.art==='opgave'">
                <div class="flex flex-col gap-3">
                  <div class="kt-tekst" id="proeve-tekst" x-html="vis(it.opg.tekst)"></div>
                  <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <template x-for="s in (it.art==='opgave' ? it.opg.svar : [])" :key="s.id">
                      <label class="f"><span x-html="vis(s.navn)"></span>
                        <span class="flex items-center gap-2"><input class="inp num flex-1 min-w-0" inputmode="decimal" autocomplete="off" :id="'proeve-svar-' + s.id" x-model="it.ind[s.id]" placeholder="fx 4,7"><span class="text-sm text-muted" x-text="s.enhed"></span></span>
                      </label>
                    </template>
                  </div>
                  <p class="text-xs text-muted">Facit vises først, når prøven er afleveret.</p>
                </div>
              </template>

              <template x-if="it.art==='case'">
                <div class="flex flex-col gap-3" id="proeve-case">
                  <h3 class="font-semibold" x-text="(it.c || {}).titel"></h3>
                  <template x-if="it.state==='ny'">
                    <div class="flex flex-col gap-2"><div class="text-sm" x-html="vis(it.c.intro)"></div>
                      <button class="btn btn-primary self-start" id="proeve-case-start" @click="proeveCaseStart(it)">Start casen</button>
                      <p class="text-xs text-muted">Du får ingen feedback undervejs, og du kan ikke forlade casen, før den er slut.</p></div>
                  </template>
                  <template x-if="it.state==='igang'">
                    <div class="flex flex-col gap-3">
                      <details class="panel p-3 text-sm"><summary class="cursor-pointer text-muted">Situationen</summary><div class="mt-2" x-html="vis(it.c.intro)"></div></details>
                      <div class="kt-tekst" id="proeve-case-tekst" x-html="vis(proeveCaseT().tekst)"></div>
                      <template x-if="proeveCaseT().type==='valg'">
                        <div class="flex flex-col gap-2">
                          <template x-for="(s, i) in (proeveCaseT().type==='valg' ? proeveCaseT().svar : [])" :key="i"><button class="btn !justify-start !whitespace-normal text-left !py-2 !text-sm" :id="'proeve-case-svar-' + i" @click="proeveCaseSvar(it, i)"><span x-html="vis(s.tekst)"></span></button></template>
                        </div>
                      </template>
                      <template x-if="proeveCaseT().type==='tal'">
                        <div class="flex flex-wrap items-end gap-2">
                          <label class="f">Dit svar<input id="proeve-case-tal" class="inp num !w-40" inputmode="decimal" autocomplete="off" x-model="proeveCaseA().tal" @keydown.enter.prevent="proeveCaseSvar(it)"></label>
                          <span class="pb-2" x-text="proeveCaseT().enhed"></span><button class="btn btn-primary" id="proeve-case-tjek" @click="proeveCaseSvar(it)">Svar</button>
                        </div>
                      </template>
                      <template x-if="proeveCaseT().type==='flere'">
                        <div class="flex flex-col gap-2">
                          <template x-for="(m, i) in (proeveCaseT().type==='flere' ? proeveCaseT().muligheder : [])" :key="i"><label class="panel p-2 flex gap-2 items-start text-sm cursor-pointer"><input type="checkbox" class="mt-1" :id="'proeve-case-flere-' + i" x-model="proeveCaseA().flere[i]"><span x-html="vis(m.tekst)"></span></label></template>
                          <button class="btn btn-primary self-start" id="proeve-case-tjek" @click="proeveCaseSvar(it)">Svar</button>
                        </div>
                      </template>
                    </div>
                  </template>
                  <p class="text-sm" id="proeve-case-faerdig" x-show="it.state==='faerdig'">Casen er afsluttet. Resultatet ses, når prøven er afleveret.</p>
                </div>
              </template>
            </article>
          </template>

          <div class="flex flex-wrap gap-2">
            <button class="btn" id="proeve-forrige" :disabled="p.nu===0" @click="proeveGaa(p.nu - 1)">Forrige</button>
            <button class="btn" id="proeve-naeste" :disabled="p.nu===p.items.length - 1" @click="proeveGaa(p.nu + 1)">Næste</button>
            <button class="btn btn-primary ml-auto" id="proeve-aflever" @click="proeveAflever()">Aflever prøven</button>
          </div>
        </div>
      </template>

      <!-- Resultat og gennemgang -->
      <template x-if="proeveAkt && p.faerdig && p.res">
        <div class="flex flex-col gap-3" id="proeve-slut">
          <div class="panel p-4 flex flex-col gap-3">
            <div class="flex flex-wrap items-baseline gap-4">
              <span class="text-sm text-muted">Karakter</span><span class="num text-4xl" id="proeve-karakter" x-text="p.res.karakter"></span>
              <span class="num text-xl" id="proeve-pct" x-text="proeveFmt(p.res.pct) + ' %'"></span>
              <span class="num text-sm text-muted" x-text="proeveFmt(p.res.point) + ' af ' + p.res.maks + ' point'"></span>
              <span class="font-semibold" id="proeve-bestaaet" :style="'color:var(' + (p.res.bestaaet ? '--ok' : '--crit') + ')'" x-text="p.res.bestaaet ? 'Bestået' : 'Ikke bestået'"></span>
            </div>
            <p class="warn text-sm" x-show="p.tidUd">Tiden løb ud. Ubesvarede spørgsmål giver 0 point.</p>
            <p class="text-xs text-muted">Karakteren er en vejledende omregning af procenten til 7-trinsskalaen.</p>
            <template x-for="e in p.res.emner" :key="e.id">
              <div class="grid grid-cols-[minmax(0,1fr)_auto] gap-x-3 text-sm"><span x-text="e.navn"></span><span class="num text-muted" x-text="e.pct + ' % (' + proeveFmt(e.point) + '/' + e.maks + ')'"></span>
                <div class="meter col-span-2"><i :style="'width:' + e.pct + '%'"></i></div></div>
            </template>
          </div>

          <h2 class="hd text-lg">Gennemgang</h2>
          <template x-for="(it, i) in p.items" :key="i">
            <div class="panel p-3 flex flex-col gap-2 text-sm proeve-gennemgang">
              <div class="flex flex-wrap items-center gap-2 text-xs text-muted"><span class="num" x-text="(i + 1) + '.'"></span><span class="tag" x-text="{ kort:'Kort', regel:'Regel', opgave:'Opgave', case:'Case' }[it.art]"></span><span class="tag" x-text="emneKort(it.emne)"></span>
                <span class="num ml-auto" x-text="proeveFmt(it.point) + '/' + it.maks"></span></div>
              <template x-if="it.art==='kort'"><div class="flex flex-col gap-1"><div x-html="vis(it.k.front)"></div><div class="text-muted" x-html="vis(it.k.bag)"></div>
                <p class="text-xs" x-text="'Din vurdering: ' + (it.vurd === 1 ? 'rigtigt' : it.vurd === 0.5 ? 'delvist' : it.vurd === 0 ? 'forkert' : 'ikke besvaret')"></p></div></template>
              <template x-if="it.art==='regel'"><div class="flex flex-col gap-1"><div x-html="vis('**' + it.r.titel + '**')"></div><p class="text-xs text-muted" x-text="it.r.kilde"></p><div class="text-muted" x-html="vis(it.r.resume)"></div>
                <p class="warn text-xs" x-show="!it.r.verificeret">Ikke kontrolleret mod kilden.</p>
                <p class="text-xs" x-text="'Din vurdering: ' + (it.vurd === 1 ? 'rigtigt' : it.vurd === 0.5 ? 'delvist' : it.vurd === 0 ? 'forkert' : 'ikke besvaret')"></p></div></template>
              <template x-if="it.art==='opgave'"><div class="flex flex-col gap-2"><div x-html="vis(it.opg.tekst)"></div>
                <template x-for="s in (it.art==='opgave' ? it.opg.svar : [])" :key="s.id"><p><span x-html="vis(s.navn)"></span>: <span class="num" x-text="proeveDel(it, s.id).gyldig ? 'dit svar ' + opgFmt(proeveDel(it, s.id).ind) : 'intet svar'"></span>, <span class="num" :style="'color:var(' + (proeveDel(it, s.id).ok ? '--ok' : '--crit') + ')'" x-text="'facit ' + opgFmt(s.vaerdi) + ' ' + s.enhed"></span></p></template>
                <p x-show="(it.res || {}).fejltype" x-text="'Typisk fejl: ' + opgFejlNavn((it.res || {}).fejltype)"></p><div class="text-muted" x-show="(it.res || {}).forklaring" x-html="vis((it.res || {}).forklaring)"></div>
                <ol class="list-decimal pl-5 text-muted"><template x-for="(t, j) in (it.art==='opgave' ? it.opg.trin : [])" :key="j"><li x-html="vis(t)"></li></template></ol></div></template>
              <template x-if="it.art==='case'"><div class="flex flex-col gap-1"><p class="font-semibold" x-text="(it.c || {}).titel"></p>
                <p x-text="it.state==='faerdig' ? 'Score: ' + Math.round(it.score * 100) + ' %. Gennemgå forklaringerne under Cases.' : 'Casen blev ikke afsluttet.'"></p></div></template>
            </div>
          </template>
          <button class="btn btn-primary self-start" id="proeve-ny" @click="proeveLuk()">Tilbage til start</button>
        </div>
      </template>
    </section>
  </template>

  <!-- ===== KORT ===== -->
  <template x-if="klar && view==='kort'">
    <section class="flex flex-col gap-3" id="v-kort">
      <div class="flex flex-wrap gap-2 items-end">
        <label class="f grow min-w-[12rem]">Søg<input id="k-soeg" class="inp" type="search" x-model="kf.q" placeholder="Tekst, tag eller kilde"></label>
        <label class="f">Emne<select class="inp" x-model="kf.emne"><option value="">Alle</option><template x-for="e in emner" :key="e.id"><option :value="e.id" x-text="e.kort"></option></template></select></label>
        <label class="f">Type<select class="inp" x-model="kf.type"><option value="">Alle</option><template x-for="(n, t) in korttyper" :key="t"><option :value="t" x-text="n"></option></template></select></label>
        <label class="f">Status<select class="inp" x-model="kf.status"><option value="">Alle</option><template x-for="(n, s) in statusNavn" :key="s"><option :value="s" x-text="n"></option></template></select></label>
        <label class="f" x-show="alleTags().length">Tag<select class="inp" x-model="kf.tag"><option value="">Alle</option><template x-for="t in alleTags()" :key="t"><option :value="t" x-text="t"></option></template></select></label>
      </div>
      <div class="flex flex-wrap gap-2">
        <button id="k-ny" class="btn btn-primary" @click="nytKortForm()">Nyt kort</button>
        <!-- ===== IMPORT-KNAP (js/import.js) ===== -->
        <button id="k-import" class="btn" x-show="typeof aabnImport === 'function'" @click="aabnImport()">Importér fra Anki</button>
        <template x-for="p in startpakker" :key="p.fil"><button class="btn" @click="indlaesStartpakke(p)" x-text="'Hent ' + p.navn"></button></template>
      </div>
      <p class="text-sm text-muted num" x-text="kortListe().length + ' kort'"></p>
      <div class="panel overflow-x-auto">
        <table class="kt" id="k-tabel">
          <thead><tr><th>Forside</th><th>Emne</th><th>Status</th><th class="hidden sm:table-cell">Kilde</th></tr></thead>
          <tbody>
            <template x-for="k in kortListe().slice(0, kSide)" :key="k.id">
              <tr @click="redigerKort(k)">
                <td><div class="klip" x-text="k.front"></div><div class="flex flex-wrap gap-1 mt-1" x-show="k.tags.length"><template x-for="t in k.tags" :key="t"><span class="tag" x-text="t"></span></template></div></td>
                <td class="whitespace-nowrap" x-text="emneKort(k.emne)"></td>
                <td class="whitespace-nowrap"><span class="st" :class="kortStatus(k)" x-text="statusNavn[kortStatus(k)]"></span><div class="text-xs text-muted num" x-text="naesteTxt(k)"></div></td>
                <td class="hidden sm:table-cell text-xs text-muted" x-text="kildeTxt(k)"></td>
              </tr>
            </template>
          </tbody>
        </table>
        <p class="p-4 text-sm text-muted" x-show="!kortListe().length">Ingen kort matcher.</p>
      </div>
      <button class="btn self-start" x-show="kortListe().length > kSide" @click="kSide += 100">Vis flere</button>
    </section>
  </template>

  <!-- ===== DATA OG INDSTILLINGER ===== -->
  <template x-if="klar && view==='data'">
    <section class="flex flex-col gap-4" id="v-data">
      <div class="panel p-4 flex flex-col gap-3">
        <h2 class="hd text-lg">Læring</h2>
        <div class="grid sm:grid-cols-3 gap-3">
          <label class="f">Nye kort pr. dag<input id="i-nye" class="inp num" type="number" min="0" max="200" x-model.number="indst.nyePrDag" @change="gemIndst(); oevStart()"></label>
          <label class="f">Ønsket hukommelse<select class="inp" x-model.number="indst.retention" @change="gemIndst()">
            <option value="0.8">80 % (færre gentagelser)</option><option value="0.85">85 %</option><option value="0.9">90 % (anbefalet)</option><option value="0.95">95 % (mange gentagelser)</option></select></label>
          <label class="f">Længste interval (dage)<input class="inp num" type="number" min="30" max="36500" x-model.number="indst.maksInterval" @change="gemIndst()"></label>
        </div>
        <p class="text-xs text-muted">Gentagelserne planlægges med FSRS, som beregner, hvornår du med den valgte sandsynlighed stadig kan huske hvert kort.</p>
      </div>

      <div class="panel p-4 flex flex-col gap-3">
        <h2 class="hd text-lg">Backup</h2>
        <p class="text-sm text-muted">Hent alle kort, læringstilstand og svar som én fil. Når en backup indlæses, flettes den med det, der er her. Intet slettes.</p>
        <p class="text-xs text-muted" x-text="sidstBackup ? 'Seneste backup: ' + datoTxt(sidstBackup) : 'Der er ikke hentet en backup endnu.'"></p>
        <div class="flex flex-wrap gap-2">
          <button id="d-backup" class="btn btn-primary" @click="hentBackup()">Hent backup</button>
          <label class="btn">Indlæs backup<input id="d-indlaes" type="file" accept=".json,application/json" class="hidden" @change="indlaesBackupFil($event)"></label>
        </div>
      </div>

      <div class="panel p-4 flex flex-col gap-3" id="d-synk">
        <h2 class="hd text-lg">Synkronisering mellem enheder</h2>
        <template x-if="!synk">
          <div class="flex flex-col gap-2">
            <p class="text-sm text-muted">Data gemmes i en hemmelig Gist på din GitHub-konto. Lav et token med adgangen <b>gist</b> på github.com under Settings → Developer settings → Personal access tokens, og indsæt det her. Tokenet gemmes kun i denne browser.</p>
            <div class="flex flex-wrap gap-2"><input id="d-token" class="inp grow !w-auto" type="password" autocomplete="off" x-model="synkTokenInput" placeholder="GitHub-token">
              <button class="btn btn-primary" :disabled="!synkTokenInput.trim() || synkKoerer" @click="synkForbind()">Forbind</button></div>
          </div>
        </template>
        <template x-if="synk">
          <div class="flex flex-col gap-2">
            <p class="text-sm"><span x-text="synkTxt()"></span><span class="text-muted" x-show="synk.login" x-text="' · konto ' + synk.login"></span></p>
            <div class="flex flex-wrap gap-2"><button class="btn" :disabled="synkKoerer" @click="synkNu()">Synkronisér nu</button><button class="btn btn-danger" @click="synkAfbryd()">Slå fra på denne enhed</button></div>
          </div>
        </template>
        <p class="warn text-sm" x-show="synkFejl" x-text="synkFejl"></p>
      </div>

      <div class="panel p-4 text-sm text-muted flex flex-col gap-1">
        <h2 class="hd text-lg text-ink">Om</h2>
        <p x-text="'Elskolen version ' + appVersion + '. ' + kort.filter(k => !k.slettet).length + ' kort, ' + log.length + ' svar i loggen.'"></p>
        <p>Indholdet er vejledende. Kontrollér altid mod gældende love, bekendtgørelser og standarder.</p>
      </div>
    </section>
  </template>

  <!-- ===== DIALOG: KORT ===== -->
  <template x-if="modal==='kort' && kRed">
    <div class="sloer" @click.self="lukModal()">
      <div class="dialog p-4 flex flex-col gap-3" role="dialog" aria-modal="true" aria-labelledby="k-titel" id="k-dialog">
        <h2 id="k-titel" class="hd text-xl" x-text="kRed.ny ? 'Nyt kort' : 'Ret kort'"></h2>
        <div class="grid grid-cols-2 gap-3">
          <label class="f">Emne<select class="inp" x-model="kRed.f.emne"><template x-for="e in emner" :key="e.id"><option :value="e.id" :selected="e.id===kRed.f.emne" x-text="e.navn"></option></template></select></label>
          <label class="f">Type<select class="inp" x-model="kRed.f.type"><template x-for="(n, t) in korttyper" :key="t"><option :value="t" :selected="t===kRed.f.type" x-text="n"></option></template></select></label>
        </div>
        <label class="f">Forside (spørgsmål)<textarea id="k-front" class="inp" rows="3" x-model="kRed.f.front"></textarea></label>
        <label class="f">Bagside (svar)<textarea id="k-bag" class="inp" rows="4" x-model="kRed.f.bag"></textarea></label>
        <p class="text-xs text-muted">Formler skrives mellem dollartegn, fx <code>$P = \sqrt{3} \cdot U \cdot I \cdot \cos\varphi$</code>. **Fed** med to stjerner.</p>
        <div class="panel p-3 kt-tekst !text-base" x-show="kRed.f.front || kRed.f.bag">
          <div x-html="vis(kRed.f.front)"></div><hr class="my-2 border-line"><div x-html="vis(kRed.f.bag)"></div>
        </div>
        <fieldset class="grid grid-cols-2 sm:grid-cols-4 gap-3">
          <legend class="text-xs font-semibold text-muted uppercase tracking-wide mb-1">Kilde</legend>
          <label class="f col-span-2">Dokument<input id="k-dok" class="inp" x-model="kRed.f.kilde.dok" placeholder="fx DS/HD 60364-5-52" list="k-dok-liste"></label>
          <label class="f">Afsnit<input class="inp" x-model="kRed.f.kilde.afsnit" placeholder="fx 525"></label>
          <label class="f">Udgave<input class="inp" x-model="kRed.f.kilde.udgave" placeholder="fx 2011"></label>
          <label class="f col-span-2 sm:col-span-1">Gyldig fra<input class="inp" type="date" x-model="kRed.f.kilde.gyldigFra"></label>
          <label class="f col-span-2 sm:col-span-3">Tags (komma imellem)<input class="inp" x-model="kRed.f.tagsTxt" placeholder="fx ΔU, kabler"></label>
        </fieldset>
        <datalist id="k-dok-liste"><template x-for="d in [...new Set(kort.map(k => k.kilde.dok).filter(Boolean))]" :key="d"><option :value="d"></option></template></datalist>
        <div class="flex flex-wrap gap-2 justify-between">
          <div class="flex flex-wrap gap-2" x-show="!kRed.ny">
            <button class="btn btn-danger" @click="sletKort(kort.find(k => k.id === kRed.f.id))">Slet</button>
            <button class="btn" x-show="tilst[kRed.f.id]" @click="nulstilKort(kort.find(k => k.id === kRed.f.id))">Start forfra</button>
          </div>
          <span x-show="kRed.ny"></span>
          <div class="flex flex-wrap gap-2">
            <button class="btn" @click="lukModal()">Annullér</button>
            <button class="btn" x-show="kRed.ny" @click="gemKortForm(true)">Gem og opret næste</button>
            <button id="k-gem" class="btn btn-primary" @click="gemKortForm(false)">Gem</button>
          </div>
        </div>
      </div>
    </div>
  </template>

  <!-- ===== DIALOG: IMPORT (js/import.js) ===== -->
  <template x-if="modal==='import' && imp">
    <div class="sloer" @click.self="lukModal()">
      <div class="dialog p-4 flex flex-col gap-3" role="dialog" aria-modal="true" aria-labelledby="imp-titel" id="imp-dialog">
        <h2 id="imp-titel" class="hd text-xl">Importér fra Anki</h2>
        <p class="text-xs text-muted">Vælg en tekstfil fra Anki (Filer &rarr; Eksportér &rarr; Notes in Plain Text) eller en CSV-fil, eller indsæt teksten. Læringshistorik importeres ikke: kortene starter som nye.</p>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <label class="f">Fil<input id="imp-fil" type="file" accept=".txt,.csv,.tsv" class="inp" @change="impVaelgFil($event)"></label>
          <label class="f">Eller indsæt tekst<textarea id="imp-tekst" class="inp" rows="3" :value="imp.tekst" @input="impNy($event.target.value, '')"></textarea></label>
        </div>
        <template x-if="imp.t && imp.t.raekker.length">
          <div class="flex flex-col gap-3">
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
              <label class="f">Forside<select id="imp-front" class="inp" x-model.number="imp.front" @change="impOpdater()"><template x-for="k in impKolonner()" :key="k"><option :value="k" :selected="k===imp.front" x-text="impKolTxt(k)"></option></template></select></label>
              <label class="f">Bagside<select id="imp-bag" class="inp" x-model.number="imp.bag" @change="impOpdater()"><option value="0" :selected="!imp.bag">(ingen)</option><template x-for="k in impKolonner()" :key="k"><option :value="k" :selected="k===imp.bag" x-text="impKolTxt(k)"></option></template></select></label>
              <label class="f">Tags<select id="imp-tags" class="inp" x-model.number="imp.tags" @change="impOpdater()"><option value="0" :selected="!imp.tags">(ingen)</option><template x-for="k in impKolonner()" :key="k"><option :value="k" :selected="k===imp.tags" x-text="impKolTxt(k)"></option></template></select></label>
            </div>
            <div class="grid grid-cols-2 sm:grid-cols-3 gap-3">
              <label class="f">Emne<select id="imp-emne" class="inp" x-model="imp.emne"><template x-for="e in emner" :key="e.id"><option :value="e.id" :selected="e.id===imp.emne" x-text="e.navn"></option></template></select></label>
              <label class="f">Type<select id="imp-type" class="inp" x-model="imp.type"><template x-for="(n, t) in korttyper" :key="t"><option :value="t" :selected="t===imp.type" x-text="n"></option></template></select></label>
              <label class="f col-span-2 sm:col-span-1">Ekstra tag<input id="imp-ekstra" class="inp" x-model="imp.ekstra" @input="impOpdater()"></label>
            </div>
            <div class="flex flex-wrap gap-4 text-sm">
              <label class="flex items-center gap-2"><input type="checkbox" x-model="imp.html" @change="impOpdater()"> Felterne indeholder HTML</label>
              <label class="flex items-center gap-2"><input type="checkbox" x-model="imp.spring" @change="impOpdater()"> Første række er overskrift</label>
            </div>
            <p id="imp-tael" class="text-sm"><strong x-text="imp.nye"></strong> nye kort, <strong x-text="imp.dubl"></strong> dubletter springes over<span x-show="imp.tomme">, <span x-text="imp.tomme"></span> rækker uden forside eller bagside</span><span x-show="imp.t && (imp.t.billeder || imp.t.lyde)">. Billeder (<span x-text="imp.t ? imp.t.billeder : 0"></span>) og lyd (<span x-text="imp.t ? imp.t.lyde : 0"></span>) fjernes</span>.</p>
            <div class="flex flex-col gap-2" x-show="impEksempel().length">
              <p class="text-xs font-semibold text-muted uppercase tracking-wide">Eksempel (første 5 nye kort)</p>
              <template x-for="(k, i) in impEksempel()" :key="i">
                <div class="panel p-3 kt-tekst !text-base"><div x-html="vis(k.front)"></div><hr class="my-2 border-line"><div x-html="vis(k.bag)"></div><p class="text-xs text-muted mt-2" x-show="k.tags.length" x-text="k.tags.join(', ')"></p></div>
              </template>
            </div>
          </div>
        </template>
        <div class="flex flex-wrap gap-2 justify-end">
          <button class="btn" @click="lukModal()">Annullér</button>
          <button id="imp-ok" class="btn btn-primary" :disabled="!imp.nye" @click="impImporter()">Importér <span x-text="imp.nye"></span> kort</button>
        </div>
      </div>
    </div>
  </template>

  <!-- ===== DIALOGER: OPGAVER (js/opgaver.js) ===== -->
  <template x-if="modal==='opgInfo'">
    <div class="sloer" @click.self="lukModal()">
      <div class="dialog p-4 flex flex-col gap-3" role="dialog" aria-modal="true" aria-labelledby="opg-info-titel" id="opg-info-dialog">
        <h2 id="opg-info-titel" class="hd text-xl">Forudsætninger for opgaverne</h2>
        <p class="text-sm" x-text="opgInfoTekst"></p>
        <p class="text-sm text-muted">Svar skrives med decimalkomma. Et svar er rigtigt, hvis det er højst 2 % fra facit (1,5 % for I<sub>z</sub> og 3 % for kompensering), så du kan regne med afrundede mellemresultater. Genkendes dit svar som en typisk fejl, vises den sammen med løsningen.</p>
        <div class="flex justify-end"><button class="btn btn-primary" @click="lukModal()">Luk</button></div>
      </div>
    </div>
  </template>

  <!-- ===== DIALOGER: CASES (js/cases.js) ===== -->
  <template x-if="modal==='caseRegel' && caseRegelVist">
    <div class="sloer" @click.self="lukModal()">
      <div class="dialog p-4 flex flex-col gap-3" role="dialog" aria-modal="true" aria-labelledby="case-regel-titel" id="case-regel-dialog">
        <h2 id="case-regel-titel" class="hd text-xl" x-text="caseRegelVist.titel"></h2>
        <div class="flex flex-wrap items-center gap-2">
          <span class="st" :style="'color:' + (caseRegelVist.verificeret ? 'var(--ok)' : 'var(--crit)')" x-text="caseRegelVist.verificeret ? 'Kontrolleret' : 'Ikke kontrolleret mod kilden'"></span>
          <span class="text-xs text-muted" x-text="caseKildeTxt(caseRegelVist)"></span>
        </div>
        <div class="kt-tekst !text-base" x-html="vis(caseRegelVist.resume)"></div>
        <div class="flex flex-wrap gap-1"><template x-for="tg in (caseRegelVist.tags || [])" :key="tg"><span class="tag" x-text="tg"></span></template></div>
        <div class="flex flex-wrap gap-2 justify-end items-center">
          <a class="text-sm underline mr-auto" x-show="caseRegelVist.url" :href="caseRegelVist.url" target="_blank" rel="noopener">Kilde</a>
          <button class="btn" :disabled="caseHarKort(caseRegelVist)" @click="caseLavKort(caseRegelVist)" x-text="caseHarKort(caseRegelVist) ? 'Kort findes' : 'Lav kort'"></button>
          <button class="btn btn-primary" @click="lukModal()">Luk</button>
        </div>
      </div>
    </div>
  </template>

  <!-- ===== DIALOGER: FEJLFINDING (js/fejlfinding.js) ===== -->
  <template x-if="modal==='ff-sikker'">
    <div class="sloer" @click.self="lukModal()">
      <div class="dialog p-4 flex flex-col gap-3" role="dialog" aria-modal="true" aria-labelledby="ff-sik-titel" id="ff-sik-dialog">
        <h2 id="ff-sik-titel" class="hd text-xl">Gør anlægget spændingsløst</h2>
        <p class="text-xs text-muted">De fem sikkerhedsregler fra DS/EN 50110-1, skrevet med egne ord. Kryds dem af i rækkefølge.</p>
        <template x-for="(r, i) in ffRegler" :key="i">
          <label class="flex items-start gap-2 text-sm">
            <input type="checkbox" class="mt-1" :id="'ff-r' + i" :checked="ffTjek[i]" :disabled="i > 0 && !ffTjek[i - 1]" @change="ffSaetTjek(i, $event.target.checked)">
            <span><strong x-text="(i + 1) + '. ' + r.t + '.'"></strong> <span class="text-muted" x-text="r.b"></span></span>
          </label>
        </template>
        <div class="flex flex-wrap justify-end gap-2">
          <button class="btn" @click="lukModal()">Annullér</button>
          <button id="ff-sik-ok" class="btn btn-primary" :disabled="!ffTjek.every(Boolean)" @click="ffFrakobl()">Anlægget er spændingsløst</button>
        </div>
      </div>
    </div>
  </template>

  <!-- ===== BEKRÆFTELSE ===== -->
  <template x-if="confirm">
    <div class="sloer" @click.self="confirm=null">
      <div class="dialog p-4 flex flex-col gap-3 !max-w-md" role="alertdialog" aria-modal="true">
        <p x-text="confirm.tekst"></p>
        <div class="flex justify-end gap-2"><button class="btn" @click="confirm=null">Annullér</button><button id="bekraeft-ja" class="btn btn-primary" @click="bekraeft()" x-text="confirm.jaTekst"></button></div>
      </div>
    </div>
  </template>

  <div class="toasts" aria-live="polite"><template x-for="t in toasts" :key="t.id"><div class="toast" :class="t.fejl && 'fejl'" x-text="t.tekst"></div></template></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/ts-fsrs@5.2.3/dist/index.umd.js"></script>
<script src="js/data.js?v=0.4.2"></script>
<script src="js/lager.js?v=0.4.2"></script>
<script src="js/synk.js?v=0.4.2"></script>
<script src="js/oev.js?v=0.4.2"></script>
<script src="js/kort.js?v=0.4.2"></script>
<script src="js/import.js?v=0.4.2"></script>
<script src="js/opgaver.js?v=0.4.2"></script>
<script src="js/cases.js?v=0.4.2"></script>
<script src="js/fejlfinding.js?v=0.4.2"></script>
<script src="js/kompetence.js?v=0.4.2"></script>
<script src="js/proeve.js?v=0.4.2"></script>
<script src="js/app.js?v=0.4.2"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/alpinejs/3.14.1/cdn.min.js" onerror="document.getElementById('fail').hidden=false"></script>
<script>setTimeout(() => { if (!window.__alpineOk || typeof FSRS === 'undefined') document.getElementById('fail').hidden = false; }, 6000);</script>
</body>
</html>
